name: Deploy to GitHub Pages

# Builds the static site and deploys it to GitHub Pages on every push to main.
# basePath + site URL are derived automatically by actions/configure-pages, so
# this works whether the repo is a project site (served from /<repo>) or a
# user/org site (served from root) with zero manual configuration.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the official Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        # Outputs base_path (e.g. "/MyPortFolio") and base_url (full origin+path).
        # enablement: true turns on GitHub Pages automatically on the first run,
        # so no manual Settings -> Pages step is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Feed the auto-detected path/URL into next.config.mjs + metadata.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
